# 四项门禁与 CLAUDE.md「提交规范」完全一致，顺序也保持一致，便于本地复现。
#
# 测试全部 mock 了网络与 LLM（见 CLAUDE.md「测试」），因此这里不需要任何密钥，
# 也不需要联网访问外部数据源。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        # 注意：本 action 没有 v10 这类大版本标签，只能钉完整版本号。
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: 同步依赖
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest
