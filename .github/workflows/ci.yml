# 与本地完全同一套门禁：本地跑 `bash scripts/gate.sh`，这里也跑它。
# 命令的单一事实来源在 scripts/gate.sh，本文件不重复列出 ruff/mypy/pytest。
#
# 测试全部 mock 了网络与 LLM（见 CLAUDE.md「测试」），因此这里不需要任何密钥，
# 也不需要联网访问外部数据源。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        # 注意：本 action 没有 v10 这类大版本标签，只能钉完整版本号。
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: 同步依赖
        run: uv sync --locked

      - name: 质量门禁
        run: bash scripts/gate.sh
